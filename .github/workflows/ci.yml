name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: Bogdanp/setup-racket@v1.16
        with:
          architecture: x64
          distribution: full
          variant: CS
          version: stable
      - name: Install package
        run: raco pkg install --auto --batch --link --name parser-combinator "$GITHUB_WORKSPACE"
      - name: Check package dependencies
        # Unused deps are only reported as a warning, so fail on the message,
        # which is singular or plural depending on the count. pipefail keeps
        # raco's own failure, such as an undeclared dependency, from being
        # hidden by tee.
        run: |
          set -o pipefail
          raco setup --check-pkg-deps --unused-pkg-deps --pkgs parser-combinator 2>&1 | tee setup.log
          ! grep -Eq 'unused dependenc(y|ies) detected' setup.log
      - name: Run tests
        # test-engine reports failures but always exits 0, so require each
        # test file to print its "All N tests passed!" summary.
        run: |
          status=0
          for f in *-tests.rkt; do
            out=$(raco test "$f" 2>&1) || status=1
            echo "$out"
            echo "$out" | grep -Eq '^All [0-9]+ tests passed!' || status=1
          done
          exit $status
